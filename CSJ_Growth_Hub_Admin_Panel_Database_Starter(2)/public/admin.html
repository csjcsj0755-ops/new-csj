<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSJ Growth Hub · Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body class="admin-body"><header class="top"><a class="brand" href="/"><img src="assets/csj-logo.jpg" alt="" onerror="this.style.display='none'"><span>CSJ Growth Hub<small>Admin console</small></span></a><nav><a href="/">View website ↗</a><button id="adminTheme">Theme</button></nav></header>
<main class="admin-wrap"><section id="loginPanel" class="admin-card narrow"><div class="eyebrow">SECURE ACCESS</div><h1>Admin sign in</h1><p>Only authorised administrators can manage platforms and services.</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" required value=""></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button full">Sign in</button><p id="loginError" class="error" role="status"></p></form></section>
<section id="dashboard" hidden><div class="admin-heading"><div><div class="eyebrow">CATALOGUE MANAGEMENT</div><h1>Manage your website</h1><p>Add or edit platforms, services, logos, prices and quantity limits. Changes save to the database.</p></div><button id="logout" class="button secondary">Sign out</button></div>
<div class="admin-columns"><section class="admin-card"><h2>Platform</h2><form id="platformForm"><input type="hidden" name="id"><label>Platform name<input name="name" required placeholder="e.g. Instagram"></label><label>URL slug<input name="slug" required placeholder="e.g. instagram"></label><label>Short description<textarea name="description" rows="2" placeholder="Describe this platform"></textarea></label><label>Logo image (optional)<input name="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><div class="form-actions"><button class="button">Save platform</button><button type="button" id="resetPlatform" class="button secondary">Clear</button></div></form><div id="platformList" class="manage-list"></div></section>
<section class="admin-card"><h2>Service</h2><form id="serviceForm"><input type="hidden" name="id"><label>Platform<select name="platformId" required id="servicePlatform"></select></label><label>Service name<input name="title" required placeholder="e.g. Instagram Live Stream Views"></label><label>Description<textarea name="description" rows="3" required placeholder="What does this service include?"></textarea></label><div class="two"><label>Price per 100 units (₹)<input name="pricePer100" type="number" min="0" step="0.01" required value="100"></label><label>Minimum quantity<input name="minQuantity" type="number" min="1" required value="100"></label></div><label>Maximum quantity<input name="maxQuantity" type="number" min="1" required value="1000000"></label><label>Unit label<input name="unit" required value="followers" placeholder="followers, views, likes..."></label><label>Tag (optional)<input name="tag" placeholder="Popular / Live"></label><div class="form-actions"><button class="button">Save service</button><button type="button" id="resetService" class="button secondary">Clear</button></div></form><div id="serviceList" class="manage-list"></div></section></div><p id="adminNotice" role="status" class="notice"></p></section></main><script src="js/admin.js"></script></body></html>
